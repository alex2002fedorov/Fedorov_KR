services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "5000:5000"
    networks:
      - security-net
    environment:
      - ANALYZER_URL=http://analyzer:5001/analyze
      - MANAGER_URL=http://manager:5002
    depends_on:
      - analyzer
      - manager
    restart: unless-stopped

  analyzer:
    build:
      context: .
      dockerfile: docker/analyzer/Dockerfile
    ports:
      - "5001:5001"
    networks:
      - security-net
    environment:
      - MANAGER_URL=http://manager:5002
    depends_on:
      - manager
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: docker/manager/Dockerfile
    ports:
      - "5002:5002"
    networks:
      - security-net
    volumes:
      - security_data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - security-net
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - security-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: security_dashboard
        target: /etc/grafana/provisioning/dashboards/security_dashboard.json
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  security-net:
    driver: bridge

volumes:
  security_data:
  prometheus_data:
  grafana_data:

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'gateway'
          static_configs:
            - targets: ['gateway:5000']
          scrape_interval: 10s
          metrics_path: '/metrics'
          
        - job_name: 'analyzer'
          static_configs:
            - targets: ['analyzer:5001']
          scrape_interval: 10s
          metrics_path: '/metrics'
          
        - job_name: 'manager'
          static_configs:
            - targets: ['manager:5002']
          scrape_interval: 10s
          metrics_path: '/metrics'
          
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true

  grafana_dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /etc/grafana/provisioning/dashboards

  security_dashboard:
    file: ./docker/grafana/provisioning/dashboards/security_dashboard.json