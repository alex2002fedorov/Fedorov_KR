services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "5000:5000"
    networks:
      - security-net
    environment:
      - ANALYZER_URL=http://analyzer:5001/analyze
      - MANAGER_URL=http://manager:5002
    depends_on:
      - analyzer
      - manager
    restart: unless-stopped

  analyzer:
    build:
      context: .
      dockerfile: docker/analyzer/Dockerfile
    ports:
      - "5001:5001"
    networks:
      - security-net
    environment:
      - MANAGER_URL=http://manager:5002
    depends_on:
      - manager
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: docker/manager/Dockerfile
    ports:
      - "5002:5002"
    networks:
      - security-net
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - security-net
    volumes:
      # ИСПРАВЛЕННЫЙ ПУТЬ
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - security-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    networks:
      - security-net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

networks:
  security-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: